<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Baseball Models</title>
        <link rel="stylesheet" type="text/css" href="../css/rankings.css">
        <link href="favicon.ico" rel="icon" type="image/x-icon"/>
        <script type="text/javascript" src="../js/draft.js" defer></script>
    </head>
    <body>
        <!-- BANNER -->
        <div id="rankings_main">
            <div id="rankings_selector" class="row">
                <select id="year_select"></select>
                <select id="month_select" class="hidden"></select>
                <select id="model_select"><!-- MODEL_OPTIONS --></select>
                <div id="rankings_get">
                    <button id="rankings_button">Update</button>
                    <div id="rankings_error" class="hidden">Invalid Date</div>
                </div>
            </div>
            <div id="rankings_views" class="row">
            <div id="panel_select" class="toggle_group">
                <button data-section="players">Players</button>
                <button data-section="team_rank">Team Rank</button>
                <button data-section="team_draft">Team Draft</button>
            </div>
            <div id="view_select" class="toggle_group">
                <button data-view="eligible">College Eligible</button>
                <button data-view="results">Draft Results</button>
            </div>
            <div id="split_select" class="toggle_group">
                <button data-split="all">All</button>
                <button data-split="hitters">Hitters</button>
                <button data-split="pitchers">Pitchers</button>
            </div>
            <select id="team_select"></select>
        </div>
            <details class="dropdown_description">
                <summary>About</summary>
                <!-- DESC DRAFT PLAYERS -->
                <!-- DESC DRAFT TEAMRANK -->
                <!-- DESC DRAFT TEAMDRAFT -->
            </details>
            <!-- RANKINGS TABLE -->
            <div id="team_rank">
                <div id="team_rank_header" class="rankings_header"></div>
                <table id="team_draft_table">
                    <thead id="team_draft_head"></thead>
                    <tbody id="team_draft_body"></tbody>
                </table>
            </div>
            <div id="team_draft">
                <div id="team_draft_header" class="rankings_header"></div>
                <table id="team_draft_players_table">
                    <thead id="team_draft_players_head"></thead>
                    <tbody id="team_draft_players_body"></tbody>
                </table>
            </div>
        </div>
    </body>
</html>
