<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Baseball Models</title>
        <link rel="stylesheet" type="text/css" href="../css/player.css">
        <link href="favicon.ico" rel="icon" type="image/x-icon"/>
        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script>
        <script type="text/javascript" src="../js/player.js" defer></script>
    </head>
    <body>
        <!-- BANNER -->
        <div id="top_level" class="row">
            <div id="player">
                <div id="player_name"></div>
                <div class="center_text"><a id="player_team"></a></div>
                <div id="player_row2" class="row">
                    <div id="player_status"></div>
                    <div id="player_position"></div>
                </div>
                <div id="player_age" class="center_text"></div>
                <div id="player_draft" class="center_text"></div>
            </div>
            <div id="right_column" class="column">
                <div id="model_toggle" class="toggle_group">
                    <button data-section="prospect" id="prospect_toggle">Prospect</button>
                    <button data-section="mlb" id="mlb_toggle">MLB</button>
                </div>
                <div id="prospect_section">
                    <div class="model_selectors">
                        <select id="prospect_graph_selector" class="model_selector"></select>
                    </div>
                    <div class="row model_row">
                        <div class="model_pie">
                            <canvas id="prospect_pie_canvas"></canvas>
                        </div>
                        <div class="model_line">
                            <canvas id="prospect_line_canvas"></canvas>
                        </div>
                    </div>
                </div>
                <div id="mlb_section">
                    <div class="model_selectors">
                        <select id="mlb_graph_selector" class="model_selector"></select>
                        <select id="mlb_year_selector" class="model_selector">
                            <option value="0">1 Year Ahead</option>
                            <option value="1">2 Years Ahead</option>
                            <option value="2">3 Years Ahead</option>
                            <option value="3">4 Years Ahead</option>
                            <option value="4">5 Years Ahead</option>
                            <option value="5">6 Years Ahead</option>
                        </select>
                    </div>
                    <div class="row model_row">
                        <div class="model_pie">
                            <canvas id="mlb_pie_canvas"></canvas>
                        </div>
                        <div class="model_line">
                            <canvas id="mlb_line_canvas"></canvas>
                        </div>
                    </div>
                </div>
                <div id="noModelData" class="hidden center_text">Player does not have model data</div>
                <div id="playerInTraining">Player included in training data</div>

                <div id="hitter_stats" class="stats player_stats hidden">
                    <div id="hitter_stats_title"></div>
                    <div id="hitter_level_toggle" class="toggle_group">
                        <button data-level="all">All</button>
                        <button data-level="mlb">MLB</button>
                        <button data-level="milb">MiLB</button>
                    </div>
                    <table id="hitter_season_stats" class="season_stats">
                        <colgroup>
                            <col class="col_selector">
                            <col>
                            <col>
                            <col class="col_left">
                            <col>
                            <col>
                            <col class="col_left">
                            <col>
                            <col>
                            <col>
                            <col>
                            <col class="col_left">
                            <col class="col_left">
                            <col>
                            <col>
                            <col class="col_left">
                            <col>
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="vis_hidden"></th>
                                <th>Year</th>
                                <th class='table_month hidden-col'>Month</th>
                                <th>Level</th>
                                <th>Org</th>
                                <th>League</th>
                                <th>PA</th>
                                <th>AVG</th>
                                <th>OBP</th>
                                <th>SLG</th>
                                <th>ISO</th>
                                <th>wRC+</th>
                                <th>HR</th>
                                <th>BB%</th>
                                <th>K%</th>
                                <th>SB</th>
                                <th>CS</th>
                            </tr>
                        </thead>
                        <tbody id="h_stats_body"></tbody>
                    </table>
                </div>

                <div id="pitcher_stats" class="stats player_stats hidden">
                    <div id="pitcher_stats_title"></div>
                    <div id="pitcher_level_toggle" class="toggle_group">
                        <button data-level="all">All</button>
                        <button data-level="mlb">MLB</button>
                        <button data-level="milb">MiLB</button>
                    </div>
                    <table id="pitcher_season_stats" class="season_stats">
                        <colgroup>
                            <col class="col_selector">
                            <col>
                            <col>
                            <col class="col_left">
                            <col>
                            <col>
                            <col class="col_left">
                            <col>
                            <col>
                            <col class="col_left">
                            <col>
                            <col class="col_left">
                            <col>
                            <col>
                            <col>
                        </colgroup>
                        <thead>
                            <tr>
                                <th class="vis_hidden"></th>
                                <th>Year</th>
                                <th class='table_month hidden-col'>Month</th>
                                <th>Level</th>
                                <th>Org</th>
                                <th>League</th>
                                <th>IP</th>
                                <th>ERA</th>
                                <th>FIP</th>
                                <th>ERA-</th>
                                <th>FIP-</th>
                                <th>HR/9</th>
                                <th>BB%</th>
                                <th>K%</th>
                                <th>GO%</th>
                            </tr>
                        </thead>
                        <tbody id="p_stats_body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </body>
</html>
